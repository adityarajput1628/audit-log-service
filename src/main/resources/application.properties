spring.application.name=audit-log-service
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# External Secret Management & Security Parameters (Mandatory environment injection without hardcoded secret fallbacks)
schwab.security.hmac.secret=${AUDIT_HMAC_SECRET}
schwab.security.users.ingest.username=${AUDIT_INGEST_USER:ingest}
schwab.security.users.ingest.password=${AUDIT_INGEST_PASS}
schwab.security.users.auditor.username=${AUDIT_AUDITOR_USER:auditor}
schwab.security.users.auditor.password=${AUDIT_AUDITOR_PASS}
schwab.security.users.admin.username=${AUDIT_ADMIN_USER:admin}
schwab.security.users.admin.password=${AUDIT_ADMIN_PASS}
schwab.cors.allowed-origins=${AUDIT_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Database configuration (Dev Defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/audit_store;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USER:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASS:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console (Disabled by default; isolated in dev profile)
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Jackson JSON formatting
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
