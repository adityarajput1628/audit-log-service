# Development Profile Configuration
spring.config.activate.on-profile=dev

# Database Configuration (Dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/audit_store;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USER:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASS:schwab_dev_db_pass_2026}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Configuration (Dev Only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# External Security Defaults (Dev)
schwab.security.hmac.secret=${AUDIT_HMAC_SECRET:schwab_dev_hmac_secret_key_32bytes_minimum_length}
schwab.cors.allowed-origins=${AUDIT_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
