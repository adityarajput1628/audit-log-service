# Production Profile Configuration
spring.config.activate.on-profile=prod

# Production Database (PostgreSQL / Secret Manager Vault)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASS}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Hardened Security: H2 Console Strictly Disabled in Production
spring.h2.console.enabled=false

# External Secret Key Mandatory Injection (No hardcoded fallback literals allowed in production)
schwab.security.hmac.secret=${AUDIT_HMAC_SECRET}
schwab.cors.allowed-origins=${AUDIT_ALLOWED_ORIGINS}
schwab.security.users.ingest.username=${AUDIT_INGEST_USER}
schwab.security.users.ingest.password=${AUDIT_INGEST_PASS}
schwab.security.users.auditor.username=${AUDIT_AUDITOR_USER}
schwab.security.users.auditor.password=${AUDIT_AUDITOR_PASS}
schwab.security.users.admin.username=${AUDIT_ADMIN_USER}
schwab.security.users.admin.password=${AUDIT_ADMIN_PASS}
