# Test Profile Configuration
spring.config.activate.on-profile=test

# Database Configuration (In-Memory H2 for Test Isolation)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 Console for Tests
spring.h2.console.enabled=false

# External Security Test Parameters
schwab.security.hmac.secret=test_hmac_secret_key_32bytes_minimum_length
schwab.security.users.ingest.username=ingest
schwab.security.users.ingest.password=ingest123
schwab.security.users.auditor.username=auditor
schwab.security.users.auditor.password=auditor123
schwab.security.users.admin.username=admin
schwab.security.users.admin.password=admin123
schwab.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
