# Test Profile Configuration
spring.config.activate.on-profile=test

# Database Configuration (In-Memory H2 for Test Isolation)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 Console for Tests
spring.h2.console.enabled=false

schwab.security.hmac.secret=${AUDIT_HMAC_SECRET:unit_test_hmac_key_placeholder_32bytes}
schwab.security.users.ingest.username=${AUDIT_INGEST_USER:ingest_user}
schwab.security.users.ingest.password=${AUDIT_INGEST_PASS:ingest_password_placeholder}
schwab.security.users.auditor.username=${AUDIT_AUDITOR_USER:auditor_user}
schwab.security.users.auditor.password=${AUDIT_AUDITOR_PASS:auditor_password_placeholder}
schwab.security.users.admin.username=${AUDIT_ADMIN_USER:admin_user}
schwab.security.users.admin.password=${AUDIT_ADMIN_PASS:admin_password_placeholder}
schwab.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
